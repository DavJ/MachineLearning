name: Sportka tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-sportka.txt pytest
      - run: python -m pytest -q
      - run: python sportka_launcher.py predict --lines 1 --seed 42 --json
  neural:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-sportka-neural.txt pytest
      - run: python -m pytest -q
